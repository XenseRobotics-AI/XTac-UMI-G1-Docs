      - 首页: index.md
      - 产品线与配置对比: product/editions.md
      - 认识 XTac-UMI G1: product/g1.md
      - 认识数采背包: product/backpack.md
      - 技术参数: product/specs.md
      - 安全与合规: product/safety.md
  - 背包版:
      - backpack/index.md
      - 开箱、接线与供电: backpack/unbox-connect.md
      - 网络与控制台入口: backpack/network.md
      - 实时监控与录制: backpack/monitor-record.md
      - 项目、导出与发布: backpack/projects-export.md
      - 回放: backpack/playback.md
      - 系统设置: backpack/system.md
      - 升级与 OTA: backpack/update.md
      - 故障排查: backpack/troubleshooting.md
