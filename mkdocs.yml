  - PC 版:
      - pc/index.md
      - 安装: pc/install.md
      - 主机配置: pc/host-setup.md
      - 标定与自检: pc/calibration.md
      - 数据采集: pc/recording.md
      - 数据集: pc/dataset.md
      - 故障排查: pc/troubleshooting.md
      - 版本与升级: pc/versions.md
      - RobotConfig 与 SDK: pc/reference.md
  - 通用:
      - Pico4 头显与追踪器: common/pico4.md
