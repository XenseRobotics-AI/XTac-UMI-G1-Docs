# =============================================================================
# XTac-UMI G1 数采快速使用手册 · mkdocs-material 配置
# 中英双语(中文默认 / English via mkdocs-static-i18n · suffix 结构)
# 本地预览:  mkdocs serve
# 构建:      mkdocs build --strict
# 发布:      GitHub Actions -> gh-pages(见 .github/workflows/deploy.yml)
# =============================================================================

site_name: XTac-UMI G1 数采快速使用手册
site_description: XenseRobotics XTac-UMI G1 手持触觉数采夹爪 · 基于 lerobot 的数据采集快速上手
site_author: XenseRobotics
site_url: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/
copyright: 文档版本 v0.0.6 &nbsp;·&nbsp; Copyright &copy; 2026 XenseRobotics Co., Ltd.

# 不打包进站点的 docs 内文件(素材说明)
exclude_docs: |
  assets/README.md

# 链接校验:配合 --strict,断链、缺失锚点、导航外页面都会让构建失败
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# 文档仓库(右上角链接)
repo_url: https://github.com/XenseRobotics-AI/XTac-UMI-G1-Docs
repo_name: XenseRobotics-AI/XTac-UMI-G1-Docs
edit_uri: ""

theme:
  name: material
  language: zh
  # TODO: 放好素材后取消注释启用自定义 logo/favicon(文件放 docs/assets/brand/)
  # logo: assets/brand/logo.png
  # favicon: assets/brand/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
  features:
    # navigation.instant 与 i18n 语言切换器不兼容,勿开启
    # 快速手册:不用顶栏 tabs,全部章节走左侧栏(分组 + 展开)
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - glightbox
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: "XTac-UMI G1 Data-Collection Guide"
          nav_translations:
            首页: Home
            快速开始: Quickstart
            认识设备: Device Overview
            准备工作: Getting Ready
            安装: Installation
            主机与 Pico4 配置: Host & Pico4 Setup
            标定与自检: Calibration & Self-check
            采集与数据: Recording & Data
            数据采集: Data Collection
            数据集: Dataset
            参考: Reference
            故障排查: Troubleshooting
            维护保养: Maintenance
            版本与升级: Versions & Upgrades
            参考与支持: Reference & Support
  # 旧页面地址跳转到重构后的新页面(重构前的外部链接与收藏不失效)
  - redirects:
      redirect_maps:
        01-overview.md: device.md
        hardware.md: device.md
        highlights.md: device.md
        02-environment.md: install.md
        03-host-hardware.md: host-setup.md
        04-calibration.md: calibration.md
        05-data-collection.md: recording.md
        best-practices.md: recording.md
        06-dataset.md: dataset.md
        data-management.md: dataset.md
        07-faq-reference.md: reference.md
        sdk-overview.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/tree/main/docs
        sdk-install.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/blob/main/docs/INSTALL.md
        sdk-examples.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/blob/main/docs/EXAMPLES.md
        # 英文站的旧地址。redirects 插件只在默认语言(中文)构建里运行,所以键写成
        # en/<旧名>.md 让跳转页落到 /en/<旧名>/,目标必须是完整 URL(相对 .md 目标会被
        # 当成中文页校验)。
        en/01-overview.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/device/
        en/hardware.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/device/
        en/highlights.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/device/
        en/02-environment.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/install/
        en/03-host-hardware.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/host-setup/
        en/04-calibration.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/calibration/
        en/05-data-collection.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/recording/
        en/best-practices.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/recording/
        en/06-dataset.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/dataset/
        en/data-management.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/dataset/
        en/07-faq-reference.md: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/en/reference/
        en/sdk-overview.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/tree/main/docs
        en/sdk-install.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/blob/main/docs/INSTALL.md
        en/sdk-examples.md: https://github.com/XenseRobotics-AI/TacCap-Gripper/blob/main/docs/EXAMPLES.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 锚点链接
      # Unicode-aware slugs. The stock slugify strips non-ASCII, so a pure
      # Chinese heading gets no slug at all and falls back to a positional
      # _1/_2/_3 that renumbers whenever a section is inserted above it —
      # every permalink a reader copied breaks on the next edit. Worse is the
      # heading that leaves ASCII residue and silently works: "2.5 验证安装"
      # slugged to "25", so a link to it resolved in the Chinese build and
      # 404'd in the English one, where that heading reads "2.5 Verify the
      # install". Explicit {#anchor} attrs still override this.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/XenseRobotics-AI/XTac-UMI-G1-Docs

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 认识设备: device.md
  - 准备工作:
      - 安装: install.md
      - 主机与 Pico4 配置: host-setup.md
      - 标定与自检: calibration.md
  - 采集与数据:
      - 数据采集: recording.md
      - 数据集: dataset.md
  - 参考:
      - 故障排查: troubleshooting.md
      - 维护保养: maintenance.md
      - 版本与升级: versions.md
      - 参考与支持: reference.md
