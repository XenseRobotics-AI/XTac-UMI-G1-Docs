name: Deploy docs

# 站点从 gh-pages 分支发布(仓库 Settings → Pages → Source 选 gh-pages / root):
#   main → vA.B.C/ 子目录  https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/vA.B.C/
#          A.B.C 是发布的软件版本(XTac-UMI Collector 版本),不是文档仓库版本:
#          先读页脚「文档 vX.Y.Z」,再到 docs/common/reference.md 版本表里查它配套的 Collector 版本。
#          同一 Collector 版本重发会覆盖该目录(放该版本最新的文档)。
#          根目录与 latest/ 只放跳转桩,指向最新版本;versions.json 驱动顶栏的版本下拉框。
#          根目录的维护见 scripts/site_versions.py。
#   dev  → dev/vA.B.C/ 子目录  https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs/dev/vA.B.C/
#          预览站与正式站同一布局:dev/ 与 dev/latest/ 只放跳转桩,dev/versions.json 驱动预览站自己的版本下拉框,
#          下拉框里只有各版本的预览版,不会跳回正式站。
# 自己用 git + rsync 写 gh-pages,能精确控制删除范围:
# 发布某个版本只动该版本目录与根目录跳转桩,不碰其它版本与 dev/;dev 发布只动 dev/ 下的该版本目录与跳转桩。
#
# 补发旧版本:手动运行,target 选 root(或 dev 补预览),ref 填该版本在 main 上的提交。

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/site_versions.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: '发布到哪里:root(生产)或 dev(预览)'
        required: true
        default: dev
        type: choice
        options: [dev, root]
      ref:
        description: '(可选)构建哪个提交;留空用当前分支。补发旧版本时填 main 上的提交'
        required: false
        default: ''

permissions:
  contents: write

# gh-pages 是唯一的写入目标,并发写会互相覆盖,所以串行执行;
# 不取消进行中的那次,免得推到一半的分支状态残缺。
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  SITE_BASE: https://xenserobotics-ai.github.io/XTac-UMI-G1-Docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # tools/:本次运行的 workflow 所在提交,提供发布脚本
      # src/:要构建的内容,默认同一提交,补发旧版本时是 inputs.ref
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ inputs.ref || github.sha }}

      - name: 确定发布目标
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              target="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
              target="root"
          else
              target="dev"
          fi
          info="$(python3 tools/scripts/site_versions.py info src)"
          echo "${info}" | tee -a "${GITHUB_OUTPUT}"
          version="$(echo "${info}" | sed -n 's/^version=//p')"
          if [[ "${target}" == "root" ]]; then
              root=''
          else
              root='dev/'
          fi
          echo "root=${root}" >> "${GITHUB_OUTPUT}"
          echo "subdir=${root}${version}" >> "${GITHUB_OUTPUT}"
          echo "url=${SITE_BASE}/${root}${version}/" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "发布 ${{ github.ref_name }} → ${target}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: 安装依赖
        run: pip install -r src/requirements.txt

      # 预览站要自成一体:canonical、sitemap 与英文旧地址跳转都得指向 /dev/vA.B.C/,
      # 否则读者会被这些链接甩回生产站,看到的还是旧内容。
      - name: 预览站改站名
        if: steps.target.outputs.target == 'dev'
        working-directory: src
        run: |
          set -euo pipefail
          sed -i "s#^site_name: .*#& (预览)#" mkdocs.yml
          grep -m1 '^site_name:' mkdocs.yml

      # 站点地址加上版本目录(Collector 版本;预览站再多一层 dev/),并打开 Material 的版本下拉框
      # (读上一级的 versions.json:正式站读根目录的,预览站读 dev/ 的)。
      # 只在构建时注入,本地 mkdocs serve 不受影响;补发旧提交时同样适用。
      - name: 改写站点地址并启用版本下拉框
        working-directory: src
        run: |
          set -euo pipefail
          subdir='${{ steps.target.outputs.subdir }}'
          sed -i "s#${SITE_BASE}/#${SITE_BASE}/${subdir}/#g" mkdocs.yml
          python3 - <<'EOF'
          t = open('mkdocs.yml', encoding='utf-8').read()
          assert t.count('\nextra:\n') == 1, 'mkdocs.yml 里应只有一个顶层 extra:'
          t = t.replace('\nextra:\n', '\nextra:\n  version:\n    provider: mike\n', 1)
          open('mkdocs.yml', 'w', encoding='utf-8').write(t)
          EOF
          grep -m1 '^site_url:' mkdocs.yml

      - name: 构建
        working-directory: src
        run: mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

      - name: 写入 gh-pages
        run: |
          set -euo pipefail
          subdir='${{ steps.target.outputs.subdir }}'
          git clone -q --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          root='${{ steps.target.outputs.root }}'
          # 只替换这一个子目录(vA.B.C/ 或 dev/vA.B.C/),其它版本原样不动
          mkdir -p "gh-pages/${subdir}"
          rsync -a --delete src/site/ "gh-pages/${subdir}/"
          # 更新版本列表,重建根目录(或 dev/)与其 latest/ 的跳转桩
          SITE_PATH="/${{ github.event.repository.name }}/${root}" \
              python3 tools/scripts/site_versions.py publish "gh-pages/${root}" \
              '${{ steps.target.outputs.version }}' '${{ steps.target.outputs.title }}'
          touch gh-pages/.nojekyll
          cd gh-pages
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
              echo "内容无变化,跳过提交"
              exit 0
          fi
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "deploy: ${{ github.ref_name }} → ${subdir} ($(git -C ../src rev-parse --short HEAD))"
          git push -q origin gh-pages

      - name: 输出地址
        run: echo "已发布 → ${{ steps.target.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
